name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA pinned to v4.2.2, matching refresh-cookie.yml
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Playwright is skipped: tests never start the browser poller.
      - run: pip install fastapi uvicorn python-dotenv httpx pytest
      - run: python -m pytest -q
